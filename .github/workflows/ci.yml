name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm 11
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx nx affected:lint --base=origin/develop --head=HEAD

      - name: Test
        run: npx nx affected:test --base=origin/develop --head=HEAD

      - name: Build
        run: npx nx affected:build --base=origin/develop --head=HEAD
